# Daily eVA appraisal feed.
#
# Add these repository secrets before the first run
# (Settings → Secrets and variables → Actions → New repository secret):
#
#   EVA_EMAIL      the eVA sign-in email
#   EVA_PASSWORD   the eVA sign-in password
#
# The job passes them into the browser and does not print them.
# If Azure AD B2C asks for MFA, a captcha, or blocks the runner, the job fails and stops.
# A screenshot of the post-login list is uploaded as the artifact eva-search-screenshot.

name: eVA appraisals

on:
  schedule:
    # 06:00 UTC every day. GitHub may start the job later than the scheduled minute.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eva-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape appraisals from the past 30 days
        env:
          EVA_EMAIL: ${{ secrets.EVA_EMAIL }}
          EVA_PASSWORD: ${{ secrets.EVA_PASSWORD }}
        run: node scripts/eva-scrape.mjs

      - name: Upload the list screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eva-search-screenshot
          path: playwright-debug/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit the feed
        if: success()
        run: |
          git add eva-appraisals
          if git diff --cached --quiet; then
            echo "No changes to the appraisal feed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update eVA appraisals from the past 30 days."
          git push
