<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ruxley Christmas Rota 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            overflow-x: hidden;
            background: linear-gradient(to bottom, #1a1a1a 0%, #2d1818 50%, #1a1a1a 100%);
            min-height: 100vh;
            position: relative;
        }

        /* Elegant Christmas Background */
        .christmas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(139, 0, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 0, 0, 0.15) 0%, transparent 50%);
            z-index: 1;
        }

        /* Subtle Snowflakes */
        .snowflake {
            position: fixed;
            top: -10px;
            z-index: 2;
            user-select: none;
            cursor: default;
            animation-name: snowfall;
            animation-duration: 10s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1em;
        }

        @keyframes snowfall {
            0% {
                transform: translateY(-10px) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.4;
            }
            90% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(100vh) translateX(50px);
                opacity: 0;
            }
        }

        /* Subtle Snow Layer */
        .snow-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            background-image: 
                radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,0.3), transparent);
            background-size: 100% 200%;
            animation: snowDrift 30s linear infinite;
            opacity: 0.3;
        }

        @keyframes snowDrift {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 0% 200%;
            }
        }

        /* Elegant Border Accent */
        .top-accent {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(to right, transparent, #8B0000, #DC143C, #8B0000, transparent);
            z-index: 100;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.5);
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            padding: 80px 20px 50px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3em;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.1em;
            color: #d4d4d4;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .year {
            font-size: 0.9em;
            color: #8B0000;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Rota Display */
        .rota-wrapper {
            background: #ffffff;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 
                0 10px 50px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(139, 0, 0, 0.2);
            animation: fadeInUp 1s ease-out;
            position: relative;
        }

        .rota-wrapper::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, #8B0000, #DC143C, #8B0000);
            border-radius: 8px;
            z-index: -1;
            opacity: 0.3;
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .rota-image {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Subtle Corner Accents */
        .corner-accent {
            position: fixed;
            width: 80px;
            height: 80px;
            border: 2px solid rgba(139, 0, 0, 0.2);
            z-index: 5;
        }

        .corner-accent.top-left {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .corner-accent.top-right {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
        }

        .corner-accent.bottom-left {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
        }

        .corner-accent.bottom-right {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }

        /* Home Link */
        .home-link {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 35px;
            background: transparent;
            color: #ffffff;
            text-decoration: none;
            border: 2px solid #8B0000;
            border-radius: 4px;
            font-weight: 400;
            font-size: 1em;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .home-link:hover {
            background: #8B0000;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 0, 0, 0.4);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
                letter-spacing: 1px;
            }
            .subtitle {
                font-size: 1em;
            }
            .container {
                padding: 60px 15px 30px;
            }
            .rota-wrapper {
                padding: 20px;
            }
            .corner-accent {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <!-- Christmas Background -->
    <div class="christmas-bg"></div>
    
    <!-- Snow Layer -->
    <div class="snow-layer"></div>

    <!-- Top Accent -->
    <div class="top-accent"></div>

    <!-- Corner Accents -->
    <div class="corner-accent top-left"></div>
    <div class="corner-accent top-right"></div>
    <div class="corner-accent bottom-left"></div>
    <div class="corner-accent bottom-right"></div>

    <!-- Main Content -->
    <div class="container">
        <div class="header">
            <h1>Christmas Schedule</h1>
            <div class="subtitle">Ruxley BMW Dealership</div>
            <div class="year">2026</div>
        </div>

        <div class="rota-wrapper">
            <img src="assets/christmas-rota-2026.jpg" alt="Ruxley Christmas Rota 2026" class="rota-image">
        </div>

        <div style="text-align: center;">
            <a href="index.html" class="home-link">Back to Home</a>
        </div>
    </div>

    <!-- Subtle Snowfall Animation -->
    <script>
        // Create subtle snowflakes
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.innerHTML = '❄';
            snowflake.style.left = Math.random() * 100 + '%';
            snowflake.style.animationDuration = (Math.random() * 8 + 12) + 's';
            snowflake.style.fontSize = (Math.random() * 0.5 + 0.5) + 'em';
            document.body.appendChild(snowflake);

            setTimeout(() => {
                snowflake.remove();
            }, 20000);
        }

        // Gentle snowfall
        setInterval(createSnowflake, 400);
        
        // Initial snowflakes
        for (let i = 0; i < 20; i++) {
            setTimeout(createSnowflake, i * 200);
        }
    </script>
</body>
</html>
