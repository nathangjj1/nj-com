<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🎄 Ruxley Christmas Rota 2026 🎅</title>
    <link href="https://fonts.googleapis.com/css?family=Mountains+of+Christmas:700|Raleway:400,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Raleway', sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #8B0000 0%, #DC143C 25%, #B22222 50%, #8B0000 75%, #DC143C 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animated Christmas Background */
        .christmas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 50, 50, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(200, 0, 0, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Snowflakes */
        .snowflake {
            position: fixed;
            top: -10px;
            z-index: 9999;
            user-select: none;
            cursor: default;
            animation-name: snowfall;
            animation-duration: 10s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            color: white;
            font-size: 2em;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.9),
                0 0 20px rgba(255, 255, 255, 0.6),
                0 0 30px rgba(200, 220, 255, 0.4);
            filter: drop-shadow(0 0 5px white);
        }

        @keyframes snowfall {
            0% {
                transform: translateY(-10px) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) translateX(100px) rotate(360deg);
                opacity: 0.9;
            }
        }

        /* Heavy Snow Layer */
        .snow-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(2px 2px at 60% 70%, white, transparent),
                radial-gradient(1px 1px at 50% 50%, white, transparent),
                radial-gradient(1px 1px at 80% 10%, white, transparent),
                radial-gradient(2px 2px at 90% 60%, white, transparent),
                radial-gradient(1px 1px at 33% 70%, white, transparent),
                radial-gradient(2px 2px at 79% 80%, white, transparent);
            background-size: 200% 200%;
            animation: snowDrift 20s linear infinite;
            opacity: 0.6;
        }

        @keyframes snowDrift {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 0% 200%;
            }
        }

        /* Christmas Lights */
        .lights-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            z-index: 100;
            pointer-events: none;
        }

        .light {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            top: 20px;
            animation: twinkle 1.5s infinite;
        }

        .light:nth-child(1) { left: 5%; background: #ff0000; animation-delay: 0s; }
        .light:nth-child(2) { left: 15%; background: #00ff00; animation-delay: 0.3s; }
        .light:nth-child(3) { left: 25%; background: #0000ff; animation-delay: 0.6s; }
        .light:nth-child(4) { left: 35%; background: #ffff00; animation-delay: 0.9s; }
        .light:nth-child(5) { left: 45%; background: #ff00ff; animation-delay: 1.2s; }
        .light:nth-child(6) { left: 55%; background: #00ffff; animation-delay: 0.2s; }
        .light:nth-child(7) { left: 65%; background: #ff8800; animation-delay: 0.5s; }
        .light:nth-child(8) { left: 75%; background: #ff0088; animation-delay: 0.8s; }
        .light:nth-child(9) { left: 85%; background: #88ff00; animation-delay: 1.1s; }
        .light:nth-child(10) { left: 95%; background: #8800ff; animation-delay: 0.4s; }

        @keyframes twinkle {
            0%, 100% {
                box-shadow: 0 0 20px currentColor;
                opacity: 1;
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 5px currentColor;
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        /* Wire for lights */
        .lights-container::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            height: 2px;
            background: #333;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            padding: 100px 20px 50px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 1s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            font-family: 'Mountains of Christmas', cursive;
            font-size: 4em;
            color: #fff;
            text-shadow: 
                0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 30px #ff0000,
                0 0 40px #ff6666,
                2px 2px 5px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 
                    0 0 10px #ff0000,
                    0 0 20px #ff0000,
                    0 0 30px #ff0000,
                    0 0 40px #ff6666,
                    2px 2px 5px rgba(0, 0, 0, 0.5);
            }
            50% {
                text-shadow: 
                    0 0 20px #ff0000,
                    0 0 40px #ff0000,
                    0 0 60px #ff0000,
                    0 0 80px #ff0000,
                    0 0 100px #ff6666,
                    2px 2px 5px rgba(0, 0, 0, 0.5);
            }
        }

        .subtitle {
            font-size: 1.5em;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            margin-bottom: 10px;
        }

        /* Rota Display */
        .rota-wrapper {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 
                0 0 50px rgba(255, 0, 0, 0.8),
                0 0 100px rgba(255, 0, 0, 0.6),
                0 0 150px rgba(139, 0, 0, 0.4),
                inset 0 0 30px rgba(255, 200, 200, 0.3);
            animation: floatUp 1.5s ease-out, pulse 4s ease-in-out infinite 1.5s;
            border: 6px solid;
            border-image: linear-gradient(45deg, #ff0000, #dc143c, #8b0000, #ff0000) 1;
        }

        @keyframes floatUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 
                    0 0 50px rgba(255, 0, 0, 0.8),
                    0 0 100px rgba(255, 0, 0, 0.6),
                    0 0 150px rgba(139, 0, 0, 0.4);
            }
            50% {
                transform: scale(1.02);
                box-shadow: 
                    0 0 70px rgba(255, 0, 0, 1),
                    0 0 120px rgba(255, 0, 0, 0.8),
                    0 0 180px rgba(139, 0, 0, 0.6);
            }
        }

        .rota-image {
            width: 100%;
            height: auto;
            border-radius: 20px;
            display: block;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        /* Decorative Elements */
        .ornament {
            position: fixed;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            z-index: 5;
            animation: swing 3s ease-in-out infinite;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-5deg) translateY(0); }
            50% { transform: rotate(5deg) translateY(10px); }
        }

        .ornament-1 {
            top: 150px;
            left: 5%;
            background: radial-gradient(circle at 30% 30%, #ff4444, #cc0000);
            animation-delay: 0s;
        }

        .ornament-2 {
            top: 200px;
            right: 5%;
            background: radial-gradient(circle at 30% 30%, #44ff44, #00cc00);
            animation-delay: 0.5s;
        }

        .ornament-3 {
            top: 300px;
            left: 3%;
            background: radial-gradient(circle at 30% 30%, #ffd700, #ff8800);
            animation-delay: 1s;
        }

        /* Santa Hat */
        .santa-hat {
            position: fixed;
            top: 80px;
            right: 50px;
            font-size: 60px;
            animation: bounce 2s infinite;
            z-index: 50;
            transform-origin: bottom center;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(-10deg); }
            50% { transform: translateY(-20px) rotate(-5deg); }
        }

        /* Gift Box */
        .gift {
            position: fixed;
            bottom: 50px;
            left: 50px;
            font-size: 50px;
            animation: wiggle 3s infinite;
            z-index: 50;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            25% { transform: rotate(3deg); }
            50% { transform: rotate(-3deg); }
            75% { transform: rotate(3deg); }
        }

        /* Christmas Tree */
        .tree {
            position: fixed;
            bottom: 30px;
            right: 30px;
            font-size: 70px;
            animation: grow 4s infinite;
            z-index: 50;
            transform-origin: bottom center;
        }

        @keyframes grow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Sparkles */
        .sparkle {
            position: fixed;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: sparkle 2s infinite;
            z-index: 5;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Home Link */
        .home-link {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: linear-gradient(135deg, #c41e3a, #165b33);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2em;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
            animation: colorShift 3s infinite;
        }

        @keyframes colorShift {
            0%, 100% {
                background: linear-gradient(135deg, #c41e3a, #165b33);
            }
            50% {
                background: linear-gradient(135deg, #165b33, #c41e3a);
            }
        }

        .home-link:hover {
            transform: scale(1.1) rotate(2deg);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
            }
            .subtitle {
                font-size: 1.2em;
            }
            .container {
                padding: 80px 10px 30px;
            }
            .rota-wrapper {
                padding: 15px;
            }
            .santa-hat, .gift, .tree {
                font-size: 40px;
            }
            .ornament {
                width: 30px;
                height: 30px;
            }
        }

        /* Musical Notes */
        .note {
            position: fixed;
            font-size: 30px;
            animation: float 5s infinite;
            z-index: 5;
            opacity: 0.7;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            25% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Christmas Background -->
    <div class="christmas-bg"></div>
    
    <!-- Snow Layer -->
    <div class="snow-layer"></div>

    <!-- Christmas Lights -->
    <div class="lights-container">
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
    </div>

    <!-- Decorative Elements -->
    <div class="ornament ornament-1"></div>
    <div class="ornament ornament-2"></div>
    <div class="ornament ornament-3"></div>
    <div class="santa-hat">🎅</div>
    <div class="gift">🎁</div>
    <div class="tree">🎄</div>

    <!-- Main Content -->
    <div class="container">
        <div class="header">
            <h1>🎄 Merry Christmas! 🎄</h1>
            <div class="subtitle">✨ Ruxley BMW Christmas Rota 2026 ✨</div>
        </div>

        <div class="rota-wrapper">
            <img src="assets/christmas-rota-2026.jpg" alt="Ruxley Christmas Rota 2026" class="rota-image">
        </div>

        <div style="text-align: center;">
            <a href="index.html" class="home-link">🏠 Back to Home</a>
        </div>
    </div>

    <!-- Dynamic Snowflakes -->
    <script>
        // Create snowflakes
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.innerHTML = ['❄', '❅', '❆'][Math.floor(Math.random() * 3)];
            snowflake.style.left = Math.random() * 100 + '%';
            snowflake.style.animationDuration = (Math.random() * 5 + 5) + 's';
            snowflake.style.fontSize = (Math.random() * 1.5 + 0.8) + 'em';
            snowflake.style.opacity = Math.random() * 0.5 + 0.5;
            document.body.appendChild(snowflake);

            setTimeout(() => {
                snowflake.remove();
            }, 12000);
        }

        // Create heavy snowfall
        setInterval(createSnowflake, 100);
        
        // Initial burst of snow
        for (let i = 0; i < 50; i++) {
            setTimeout(createSnowflake, i * 50);
        }

        // Create sparkles
        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            document.body.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, 2000);
        }

        setInterval(createSparkle, 300);

        // Create musical notes
        function createNote() {
            const note = document.createElement('div');
            note.classList.add('note');
            note.innerHTML = ['🎵', '🎶'][Math.floor(Math.random() * 2)];
            note.style.left = Math.random() * 100 + '%';
            note.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.body.appendChild(note);

            setTimeout(() => {
                note.remove();
            }, 7000);
        }

        setInterval(createNote, 2000);

        // Add jingle bell sound effect on click (optional)
        let bellCount = 0;
        document.addEventListener('click', function(e) {
            if (bellCount < 5) {
                const bell = document.createElement('div');
                bell.style.position = 'fixed';
                bell.style.left = e.clientX + 'px';
                bell.style.top = e.clientY + 'px';
                bell.style.fontSize = '30px';
                bell.style.zIndex = '10000';
                bell.style.animation = 'float 2s forwards';
                bell.innerHTML = '🔔';
                document.body.appendChild(bell);
                
                setTimeout(() => {
                    bell.remove();
                }, 2000);
                
                bellCount++;
                setTimeout(() => { bellCount--; }, 500);
            }
        });
    </script>
</body>
</html>
